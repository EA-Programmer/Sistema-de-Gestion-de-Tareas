<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskCampus</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-4 py-6">
      <header class="flex flex-col gap-3 border-b border-slate-300 pb-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-wide text-teal-700">Gestion academica</p>
          <h1 class="text-3xl font-bold">TaskCampus</h1>
        </div>
        <div id="apiStatus" class="rounded border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700">
          API: verificando...
        </div>
      </header>

      <section class="grid gap-3 md:grid-cols-4" aria-label="Resumen de tareas">
        <div class="rounded border border-slate-300 bg-white p-4">
          <p class="text-sm text-slate-600">Total</p>
          <strong id="summaryTotal" class="text-2xl">0</strong>
        </div>
        <div class="rounded border border-slate-300 bg-white p-4">
          <p class="text-sm text-slate-600">Pendientes</p>
          <strong id="summaryPending" class="text-2xl">0</strong>
        </div>
        <div class="rounded border border-slate-300 bg-white p-4">
          <p class="text-sm text-slate-600">Finalizadas</p>
          <strong id="summaryFinished" class="text-2xl">0</strong>
        </div>
        <div class="rounded border border-slate-300 bg-white p-4">
          <p class="text-sm text-slate-600">Alta prioridad</p>
          <strong id="summaryHigh" class="text-2xl">0</strong>
        </div>
      </section>

      <section class="grid gap-6 lg:grid-cols-[380px_1fr]">
        <form id="taskForm" class="rounded border border-slate-300 bg-white p-4 shadow-sm">
          <div class="mb-4 flex items-center justify-between gap-3">
            <h2 id="formTitle" class="text-xl font-semibold">Registrar tarea</h2>
            <button
              id="cancelEditBtn"
              type="button"
              class="hidden rounded border border-slate-300 px-3 py-2 text-sm font-semibold hover:bg-slate-100"
            >
              Cancelar
            </button>
          </div>

          <input id="taskId" type="hidden" />

          <label class="mb-3 block">
            <span class="mb-1 block text-sm font-medium">Titulo</span>
            <input
              id="title"
              class="w-full rounded border border-slate-300 px-3 py-2 focus:border-teal-600 focus:outline-none"
              required
            />
          </label>

          <label class="mb-3 block">
            <span class="mb-1 block text-sm font-medium">Descripcion</span>
            <textarea
              id="description"
              class="min-h-24 w-full rounded border border-slate-300 px-3 py-2 focus:border-teal-600 focus:outline-none"
              required
            ></textarea>
          </label>

          <label class="mb-3 block">
            <span class="mb-1 block text-sm font-medium">Asignatura</span>
            <input
              id="subject"
              class="w-full rounded border border-slate-300 px-3 py-2 focus:border-teal-600 focus:outline-none"
              required
            />
          </label>

          <label class="mb-3 block">
            <span class="mb-1 block text-sm font-medium">Fecha de entrega</span>
            <input
              id="dueDate"
              type="date"
              class="w-full rounded border border-slate-300 px-3 py-2 focus:border-teal-600 focus:outline-none"
              required
            />
          </label>

          <div class="mb-4 grid gap-3 sm:grid-cols-2">
            <label>
              <span class="mb-1 block text-sm font-medium">Prioridad</span>
              <select id="priority" class="w-full rounded border border-slate-300 px-3 py-2 focus:border-teal-600 focus:outline-none">
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
              </select>
            </label>
            <label>
              <span class="mb-1 block text-sm font-medium">Estado</span>
              <select id="status" class="w-full rounded border border-slate-300 px-3 py-2 focus:border-teal-600 focus:outline-none">
                <option value="pendiente">Pendiente</option>
                <option value="en proceso">En proceso</option>
                <option value="finalizada">Finalizada</option>
              </select>
            </label>
          </div>

          <button id="submitBtn" class="w-full rounded bg-teal-700 px-4 py-2 font-semibold text-white hover:bg-teal-800" type="submit">
            Guardar tarea
          </button>
          <p id="formMessage" class="mt-3 text-sm"></p>
        </form>

        <section class="min-w-0">
          <div class="mb-4 rounded border border-slate-300 bg-white p-4">
            <div class="grid gap-3 md:grid-cols-[1fr_180px_180px_auto] md:items-end">
              <label>
                <span class="mb-1 block text-sm font-medium">Asignatura</span>
                <input id="filterSubject" class="w-full rounded border border-slate-300 px-3 py-2" placeholder="Todas" />
              </label>
              <label>
                <span class="mb-1 block text-sm font-medium">Estado</span>
                <select id="filterStatus" class="w-full rounded border border-slate-300 px-3 py-2">
                  <option value="">Todos</option>
                  <option value="pendiente">Pendiente</option>
                  <option value="en proceso">En proceso</option>
                  <option value="finalizada">Finalizada</option>
                </select>
              </label>
              <label>
                <span class="mb-1 block text-sm font-medium">Prioridad</span>
                <select id="filterPriority" class="w-full rounded border border-slate-300 px-3 py-2">
                  <option value="">Todas</option>
                  <option value="baja">Baja</option>
                  <option value="media">Media</option>
                  <option value="alta">Alta</option>
                </select>
              </label>
              <button id="clearFiltersBtn" class="rounded border border-slate-300 px-4 py-2 font-semibold hover:bg-slate-100" type="button">
                Limpiar
              </button>
            </div>
          </div>

          <div id="taskList" class="grid gap-3"></div>
          <p id="emptyState" class="hidden rounded border border-slate-300 bg-white p-6 text-center text-slate-600">
            No hay tareas registradas.
          </p>
        </section>
      </section>
    </main>

    <script src="./dist/app.js"></script>
  </body>
</html>
